collection_groups:
  - heading: Pages
    collections:
      - pages
      - resources
      - programs
  - heading: Built by Women 
    collections:   
      - bbw-years
      - bbw-projects
      - bbw-juries
  - heading: Collections 
    collections:     
      - podcasts
      - emerging-leaders
      - emerging-firms   

_structures:
  page_blocks:
    id_key: template
    values:
      - label: Text Block
        preview:
          text:
            - key: label
          subtext:
            - key: text_block
            - text: 'Add text' 
          icon: article
        value:
          template: text-block
          text_block: ''
          include_left-hand_column_text_: false
          lefthand_text:
            header_type: Large Header
            text: ''
            download: ''
            link_url: ''
            link_text: ''
          section_break: 
        _inputs:
          text_block:
            type: markdown
          section_break:
            type: checkbox
          label:
            hidden: true
      - label: Buttons
        preview:
          text: Buttons
          subtext:
            - key: buttons_header__optional_
            - text: 'Add buttons'
          icon: smart_button
        value:
          template: buttons-block
          buttons_header__optional_: ''
          button:
            - button_text:
              button_link:
          include_left-hand_column_text_: false
          lefthand_text:
            header_type: Large Header
            text: ''
            download: ''
            link_url: ''
            link_text: ''
          section_break:  
        _inputs:
          icon:
            hidden: true
          buttons_header__optional_:
            label: Buttons Header (optional)
            type: text
          button:
            hidden: false
          section_break:
            type: checkbox
      - label: Image
        preview:
            text: Image
            subtext:
              - key: image_caption_text
              - text: 'Add image'
            image:
              - key: image
        value:
          template: image-block
          image:
          image_caption_text:
          alt_text:   
          include_left-hand_column_text_: false
          lefthand_text:
            header_type: Large Header
            text: ''
            download: ''
            link_url: ''
            link_text: ''
          section_break: 
        _inputs:
          section_break:
            type: checkbox
          label:
            hidden: true  
      - label: Miscellaneous Block
        preview:
          text: Miscellaneous Block
          subtext:
            - key: miscellaneous
          icon: article
        value:
          template: miscellaneous-block
          miscellaneous: ''
          include_left-hand_column_text_: false
          lefthand_text:
            header_type: Large Header
            text: ''
            download: ''
            link_url: ''
            link_text: ''
          section_break: 
        _inputs:
          miscellaneous:
            type: markdown
          section_break:
            type: checkbox
          label:
            hidden: true              
      - label: Code Block
        preview:
          text: Code Block
          subtext:
            - text: 'Code for custom HTML, like iframes or embeds'
          icon: article
        value:
          template: code-block
          code_block: ''
          include_left-hand_column_text_: false
          lefthand_text:
            header_type: Large Header
            text: ''
            download: ''
            link_url: ''
            link_text: ''
          section_break: 
        _inputs:
          code_block:
            type: code
            options:
              language: html
          section_break:
            type: checkbox
          label:
            hidden: true     
      - label: Media Gallery
        preview:
          text: Media Gallery
          subtext:
            - text: 'Add images that link out to videos'
          icon: article
        value:
          template: media-gallery-block
          media:
            - image: ''
              title: ''
              link_to_video: ''
          include_left-hand_column_text_: false
          lefthand_text:
            header_type: Large Header
            text: ''
            download: ''
            link_url: ''
            link_text: ''
          section_break: 
        _inputs:
          section_break:
            type: checkbox
          label:
            hidden: true   
      - label: Portrait Gallery
        preview:
          text:
            - key: label
          subtext:
            - text: 'Add images'
          icon: image
        value:
          template: portrait-gallery-template
          label: ''
          portrait:
            - title: ''
              title_role: ''
              image: ''
              description: ''
          include_left-hand_column_text_: false
          lefthand_text:
            header_type: Large Header
            text: ''
            download: ''
            link_url: ''
            link_text: ''
          section_break: 
        _inputs:
          section_break:
            type: checkbox
          portrait[*].description:
            label: Biography  
      - label: Portrait Gallery with Award
        preview:
          text:
            - key: label
          subtext:
            - text: 'Add images'
          icon: image
        value:
          template: portrait-gallery-template-add-award
          label: ''
          portrait:
            - title: ''
              title_role: ''
              image: ''
              description: ''
          include_left-hand_column_text_: false
          lefthand_text:
            header_type: Large Header
            text: ''
            download: ''
            link_url: ''
            link_text: ''
          section_break: 
        _inputs:
          section_break:
            type: checkbox 
          portrait[*].description:
            label: Biography   
      - label: Sponsor Block
        preview:
          text:
            - key: label
          subtext:
            - text: "Update sponsors"
          icon: image
        value:
          template: sponsor-block
          label: Sponsors
          sponsors:
            - category: 
              sponsor:
                - name:
                  image: 
          include_left-hand_column_text_: true   
          lefthand_text:
            header_type: Medium Header         
          section_break: true
        _inputs:
          category:
            type: text
          section_break:
            type: checkbox   
      - label: Sponsor Levels
        preview:
          text:
            - key: label
            - Sponsor Levels
          subtext:
            - text: "Update sponsor levels"
          icon: image
        value:
          template: sponsor-levels
          label: Sponsors
          sponsor-levels:
            - category: 
              amount: 
              benefits:
              payment_link: 
              button_text: 
          include_left-hand_column_text_: true   
          lefthand_text:
            header_type: Medium Header         
          section_break: true
        _inputs:
          sponsor-levels:
            type: array
            options:
              min_items: 4
              max_items: 4
          sponsor-levels[*].category:
            type: text
          sponsor-levels[*].benefits:
            type: markdown
          section_break:
            type: checkbox 
      - label: BBW Slideshow
        preview:
          text:
            - key: label
          subtext:
            - text: 'Add images'
          icon: image
        value:
          template: bbw-slideshow-images
          label: ''
          bbw-slideshow-images:
            - image: ''
              caption: ''
          include_left-hand_column_text_: false
          lefthand_text:
            header_type: Large Header
            text: ''
            download: ''
            link_url: ''
            link_text: ''
          section_break: 
        _inputs:
          section_break:
            type: checkbox
          bbw-slideshow-images:
            options:
              min_items: 6  
            
                                 

             