_inputs: 
  page_blocks:
    type: array
    options:
      structures: _structures.page_blocks      
  blocks:
    options:
      preview:
          subtext:
            - key: label 
  template:
    hidden: true      

  label:
    label: Label (does not appear on website; for editor reference only)

  include_left-hand_column_text_:
    type: checkbox
    label: Show Lefthand Text?

  lefthand_text:
    type: group
    label: Lefthand Text
    options:
      collapsed: false

  lefthand_text.header_type:
    type: select
    options:
      values:
        - Large Header
        - Medium Header
        - Small Header
        - Film/Book Title
        - Link
        - Text with Download

  lefthand_text.text:
    type: markdown

  lefthand_text.download:
    type: text

  lefthand_text.link_url:
    type: text

  lefthand_text.link_text:
    type: text

  section_break:
    type: checkbox
    label: Add section break before this block?

