      - bbw-projects
      - bbw-juries
  - heading: Collections 
    collections:     
      - podcasts
      - emerging-leaders
      - emerging-firms   

_structures:
  page_blocks:
    id_key: template
    values:
      - label: Text Block
        preview:
          text: Text Block
          subtext:
            - key: text_block 
              empty_value: ""
          icon: article
        value:
          template: text-block
          text_block: ""
          section_break: false
          include_left-hand_column_text_: false
          lefthand_text:
            header_type: Large Header
            text: ''
            download: ''
            link_url: ''
          section_break: false
        _inputs:
          text_block:
            type: markdown
          include_left-hand_column_text_: 
            type: checkbox
            label: Show Lefthand Text? 
          lefthand_text.header_type:
            type: select
            options:
              values:
                - Large Header
                - Medium Header
                - Small Header
                - Film/Book Title
                - Link
                - Text with Download
          lefthand_text.text:
            type: markdown
          lefthand_text.download:
            type: text
          lefthand_text.link_url:
            type: text
          section_break:
            hidden: true
          label:
            hidden: true
      - label: Buttons
        preview:
          text: Buttons
          subtext:
          icon: smart_button
        value:
          template: buttons-block
          buttons_header__optional_: ''
          button:
            - button_text:
              button_link:
          section_break: false
          include_left-hand_column_text_: false
        _inputs:
          icon:
            hidden: true
          buttons_header__optional_:
            label: Buttons Header (optional)
            type: text
          button:
            hidden: false
          section_break:
            hidden: true
          include_left-hand_column_text_:
            hidden: true
      - label: Image Block
        preview:
          text: Image Block
          subtext:
            - key: image
              empty_value: ""
          icon: image
        value:
          template: image-block
          image:
          section_break: false
          image_caption_text:
          alt_text:   
            - label: Text Block
          include_left-hand_column_text_: false
          lefthand_text:
            header_type: Large Header
            text: ''
            download: ''
            link_url: ''
          section_break: false
        _inputs:
          text_block:
            type: markdown
          include_left-hand_column_text_: 
            type: checkbox
            label: Show Lefthand Text? 
          lefthand_text.header_type:
            type: select
            options:
              values:
                - Large Header
                - Medium Header
                - Small Header
                - Film/Book Title
                - Link
                - Text with Download
          lefthand_text.text:
            type: markdown
          lefthand_text.download:
            type: text
          lefthand_text.link_url:
            type: text
          section_break:
            hidden: true
          label:
            hidden: true  
             