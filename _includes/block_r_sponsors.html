<div class="text-block">
  {% for sp in block.sponsors %}
    <p style="margin-bottom: 0;"><strong>{{ sp.category }}</strong><br>
      <div class="logos-block" style="margin-bottom: .6em;">
        {% for item in sp.sponsor %}
          {% if item.image %}
            <div><img src="{{item.image}}"></div>
          {% endif%}
        {% endfor %}
      </div>
    {% for item in sp.sponsor %}
      {{item.name}}<br>
    {% endfor %}
    </p>
  {% endfor %}
</div>
