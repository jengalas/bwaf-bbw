<div class="text-block">
  {% for sp in block.sponsors %}
    <p style="margin-bottom: .4rem;"><strong>{{ sp.category }}</strong>
      <div class="logos-block" style="margin-bottom: .6em; row-gap: 1rem;">
        {% for item in sp.sponsor %}
          {% if item.image %}
            <div><img src="{{item.image}}"></div>
          {% endif%}
        {% endfor %}
      </div>
    {% for item in sp.sponsor %}
      {{item.name}}
    {% endfor %}
    </p>
  {% endfor %}
</div>
