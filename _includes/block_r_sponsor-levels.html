
<style>
  .cards {
    display: grid; 
    grid-template-columns: 1fr;
    grid-gap: 4rem;
    margin-bottom: 5rem;

    @media (min-width: 500px) {
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      grid-gap: 5rem 1rem;
    }
  }
  .card {
    border: 2px solid #e7e7e7; 
    border-radius: 4px; 
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
    min-height: 100%;
    position: relative;
    top: 0;

    img {
      margin-bottom: 1rem;
      width: 50%;
    }

    h2 {
      font-size: clamp(12px, 8vw, 24px);
      font-weight: bold;
      line-height: 1.2;
      margin-bottom: .5em;
      margin-top: 0;
    }

    h3 {
      font-size: 2rem;
      font-weight: bold;
    }

    ul {
      font-size: 1rem;
      color: #666;
      padding-left: .5rem;
    };

    li:before {
      content: "";
      width: 8px;
      height: 8px;
      display: inline-block;
      background-color: var(--red);
      border-radius: 50%;
      margin-right: 10px;
  }

    article {
      display: flex; 
      flex: 1;
      flex-direction: column;     
      justify-content: space-between;
    }

    .buy-btn {
      background: var(--red);
      color: #fff;
      font-size: 22px;
      padding: 10px 30px;
      text-align: center;
      display: block;
      line-height: 34px;
      font-weight: bold;
      width:100%;

      &:hover {
        background: #ee596b;
        transition: all .6s;
      }
    }

  }
</style>

<div class="cards">
{% for level in block.sponsor-levels %}
  <div class="card">
    <h2>{{ level.category }}</h2>
    <h3>{{ level.amount }}</h3>
    <article>
    {{ level.benefits | markdownify }}
    <a href="{{ level.payment_link }}"><button class="buy-btn"><b>{{ level.button_text }}</b></button></a>
    </article>
  </div>
{% endfor %}
</div>
