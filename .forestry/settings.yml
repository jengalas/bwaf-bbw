---
new_page_extension: md
auto_deploy: false
admin_path: "/admin"
webhook_url: 
sections:
- type: directory
  path: about
  label: About
  create: all
  match: "**/*"
  templates:
  - sponsors
  - main-two-up
- type: directory
  path: _resources
  label: Resources
  create: documents
  match: "**/*"
  templates:
  - podcast-main-page
  - newsletter-archive
  - main-two-up
- type: directory
  path: _programs
  label: Programs
  create: documents
  match: "**/*"
  new_doc_ext: md
  templates:
  - built-by-women-main-page
  - main-two-up
- type: heading
  label: Built By Women
- type: directory
  path: _bbw-years
  label: 'BBW: Years'
  create: documents
  match: "**/*"
  templates:
  - bbw-year
- type: directory
  path: _bbw-projects
  label: 'BBW: Projects'
  create: documents
  match: "**/*"
  templates:
  - bbw-project
- type: directory
  path: _bbw-juries
  label: 'BBW: Juries'
  create: documents
  match: "**/*"
  new_doc_ext: md
  templates:
  - bbw-jury
- type: heading
  label: Msc. Collections
- type: directory
  path: _films
  label: Films (For Film Collections)
  create: documents
  match: "**/*"
  templates:
  - film
- type: directory
  path: _emerging-leaders
  label: Emerging Leaders
  create: documents
  match: "**/*"
  templates:
  - main-two-up
- type: directory
  path: _podcasts
  label: Podcasts
  create: documents
  match: "**/*"
  templates:
  - podcast-episode
- type: heading
  label: Msc. Pages
- type: document
  path: index.html
  label: Homepage
- type: document
  path: subscribe.html
  label: Subscribe
- type: document
  path: support.html
  label: Support
upload_dir: ''
public_path: https://res.cloudinary.com/beverly-willis-architecture-foundation/image/upload
front_matter_path: ''
use_front_matter_path: true
file_template: ":filename:"
build:
  preview_env:
  - JEKYLL_ENV=staging
  preview_output_directory: _site
  install_dependencies_command: bundle install --path vendor/bundle
  preview_docker_image: forestryio/ruby:2.6
  mount_path: "/srv"
  working_dir: "/srv"
  instant_preview_command: bundle exec jekyll serve --drafts --unpublished --future
    -d _site
