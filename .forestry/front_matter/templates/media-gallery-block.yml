---
label: Lefthand Text
hide_body: true
fields:
- name: left_hand_title
  type: field_group
  config: {}
  fields:
  - name: title_type
    type: select
    default: None
    config:
      required: false
      options:
      - " Large Header"
      - Medium Header
      - " Text + Download Link"
      - None
      source:
        type: simple
        section: 
        file: 
        path: 
    label: Title type
  - name: large_header
    type: text
    config:
      required: false
    label: Large Header Text
    showOnly:
      field: title_type
      value: " Large Header"
  - name: medium_header
    type: text
    config:
      required: false
    label: Medium Header Text
    showOnly:
      field: title_type
      value: Medium Header
  - name: download_link_block
    type: field_group
    config: {}
    fields:
    - name: text_before_link
      type: text
      config:
        required: false
      label: Text before link
    - name: link_text
      type: text
      config:
        required: false
      label: Link text
    - name: file_download
      type: file
      config:
        maxSize: 64
      label: File download
    label: Text + Download Link
    showOnly:
      field: title_type
      value: " Text + Download Link"
  label: Left hand title
